services:
  # Backend Service (Rust/Axum)
  - type: web
    name: near-business-backend
    runtime: rust
    plan: standard
    rootDir: nt-be
    branch: nearcom_redesign
    buildCommand: unset DATABASE_URL && cargo build --release --bin nt-be && cargo build --release --example mark_testing_daos
    startCommand: ./target/release/nt-be
    domains:
      - api.business.near.com
    envVars:
      - key: FASTNEAR_API_KEY
        sync: false
      - key: SIGNER_KEY
        sync: false
      - key: SIGNER_ID
        sync: false
      - key: SPUTNIK_DAO_API_BASE
        sync: false
      - key: RUST_LOG
        value: info
      - key: LOG_FORMAT
        value: json
      - key: PORT
        value: 10000
      - key: UNIFIED_GOLD_LEDGER_READS
        value: "false"
      - key: GOLD_USD_ENRICHMENT_INTERVAL_SECONDS
        value: 300
      - key: JWT_SECRET
        sync: false
      - key: CONFIDENTIAL_TOKEN_KEYRING_JSON
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: near-business-db
          property: connectionString
      - key: TESTING_SPUTNIK_DAO_IDS
        sync: false
      - key: TESTING_NEAR_ACCOUNT_IDS
        sync: false
      - key: ANALYTICS_API_KEY
        sync: false
      - key: ANALYTICS_USERS
        sync: false
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 90

  # Frontend Service (Next.js)
  - type: web
    name: near-business-frontend
    runtime: node
    plan: starter
    rootDir: nt-fe
    branch: nearcom_redesign
    buildCommand: bun install && node ./node_modules/geoip-lite/scripts/updatedb.js license_key=$MAXMIND_LICENSE_KEY && bun run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    domains:
      - business.near.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAXMIND_LICENSE_KEY
        sync: false
      - key: NEXT_PUBLIC_BACKEND_API_BASE
        value: https://api.business.near.com
    healthCheckPath: /

  - type: web
    name: near-business-nocodb
    runtime: image
    plan: starter
    image:
      url: docker.io/nocodb/nocodb:0.301.3
    disk:
      name: nocodb-disk
      mountPath: /usr/app/data/
      sizeGB: 1
    envVars:
      - key: NC_CONNECTION_ENCRYPT_KEY
        generateValue: true
      - key: NC_AUTH_JWT_SECRET
        generateValue: true
      - key: NC_GOOGLE_CLIENT_ID
        sync: false
      - key: NC_GOOGLE_CLIENT_SECRET
        sync: false
      - key: NC_PUBLIC_URL
        sync: false
    healthCheckPath: /

  # Staging Backend Service (Rust/Axum)
  - type: web
    name: near-business-backend-staging
    runtime: rust
    plan: starter
    rootDir: nt-be
    branch: nearcom_redesign
    buildCommand: unset DATABASE_URL && cargo build --release --bin nt-be && cargo build --release --example mark_testing_daos
    startCommand: ./target/release/nt-be
    envVars:
      - key: FASTNEAR_API_KEY
        sync: false
      - key: SIGNER_KEY
        sync: false
      - key: SIGNER_ID
        sync: false
      - key: SPUTNIK_DAO_API_BASE
        sync: false
      - key: RUST_LOG
        value: info
      - key: LOG_FORMAT
        value: json
      - key: PORT
        value: 10000
      - key: UNIFIED_GOLD_LEDGER_READS
        value: "false"
      - key: GOLD_USD_ENRICHMENT_INTERVAL_SECONDS
        value: 300
      - key: JWT_SECRET
        sync: false
      - key: CONFIDENTIAL_TOKEN_KEYRING_JSON
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: near-business-db-staging
          property: connectionString
      - key: TESTING_SPUTNIK_DAO_IDS
        sync: false
      - key: TESTING_NEAR_ACCOUNT_IDS
        sync: false
      - key: ANALYTICS_API_KEY
        sync: false
      - key: ANALYTICS_USERS
        sync: false
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 90

  # Staging Frontend Service (Next.js)
  - type: web
    name: near-business-frontend-staging
    runtime: node
    plan: starter
    rootDir: nt-fe
    branch: nearcom_redesign
    buildCommand: bun install && node ./node_modules/geoip-lite/scripts/updatedb.js license_key=$MAXMIND_LICENSE_KEY && bun run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAXMIND_LICENSE_KEY
        sync: false
      - key: NEXT_PUBLIC_BACKEND_API_BASE
        sync: false
    healthCheckPath: /

databases:
  - name: near-business-db
    plan: basic-1gb
    diskSizeGB: 5

  - name: near-business-db-staging
    plan: basic-1gb
    diskSizeGB: 5
